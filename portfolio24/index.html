<!doctype html>
<html lang="en">
  <head>
    <!-- charset first: the spec wants it declared inside the first 1024 bytes,
         and keeping it at the very top means a later addition to <head> can
         never push it out and make the parser guess an encoding and restart. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Start DNS/TCP/TLS to the analytics origins before the requests are
         discovered. googletagmanager is a small win (its script tag is right
         below), but google-analytics.com is only reached once gtag.js has
         downloaded and run, so warming it saves a full connection setup.

         Deliberately no hint for YouTube: the motion page uses a click-to-play
         facade with self-hosted thumbnails, so the page makes no request to
         Google's video origins until a visitor actually asks for a video, and
         preconnecting on load would give that away for nothing. -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://www.google-analytics.com" />

    <!-- The body weight (400 -> Regular) is what sets the header wordmark and
         all copy above the fold. Without this the face is a three-hop discovery
         — HTML, then CSS, then @font-face — which with font-display: swap means
         a visible flash of fallback text. Only this one cut is preloaded; the
         other three are ~80 KB each and none of them carry above-the-fold text
         worth that much high-priority bandwidth. crossorigin is required: fonts
         are fetched in CORS mode, and without it the preload is not reused. -->
    <link rel="preload" href="/archive/fonts/Brut_Grotesque_WEB-Regular.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PGGQZZP1RV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-PGGQZZP1RV');
    </script>

    <title>Maxwell Yeo | Creative Portfolio</title>
    <meta name="description" content="Portfolio for my camera hobby — dance films and portrait photography">
    <meta name="author" content="Maxwell Yeo">

    <meta name="theme-color" content="#242424">
    <link rel="icon" type="image/png" href="/archive/2024/max-fav.png" />

    <!-- Static default for crawlers that don't run JS and land on /. The app
         also has real routes at /stills/ and /about/ (both listed in
         sitemap.xml, trailing slash and all) — those are pre-rendered at
         build time (scripts/prerender.mjs) with their own correct canonical
         baked in, so this default only matters for /. For a route rendered
         client-side, this href gets kept in sync with the current path once
         React mounts — see the effect in App.tsx. Without that, every route
         would claim / as canonical and a search engine could fold /stills/
         and /about/ out of its index in favour of the homepage.

         This file doubles as the template every pre-rendered page is cloned
         from (see prerender.mjs), so anything added to <head> lands on every
         route — desirable for the GA snippet and font preload below, and why
         per-route tags like this one are rewritten in place by the script
         rather than appended a second time. -->
    <link rel="canonical" href="https://maxwellyeo.com/" />

    <meta property="og:title" content="Maxwell Yeo | Creative Portfolio"/>
    <meta property="og:url" content="https://maxwellyeo.com/"/>
    <meta property="og:image" content="https://maxwellyeo.com/archive/2024/max-og.jpg"/>
    <meta property="og:image:width" content="1920"/>
    <meta property="og:image:height" content="1080"/>
    <meta property="og:site_name" content="Maxwell Yeo"/>
    <meta property="og:description" content="Portfolio for my camera hobby — dance films and portrait photography"/>
    <meta property="og:type" content="website"/>

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Maxwell Yeo | Creative Portfolio">
    <meta name="twitter:description" content="Portfolio for my camera hobby — dance films and portrait photography">
    <meta name="twitter:image" content="https://maxwellyeo.com/archive/2024/max-og.jpg">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Receiving end of the static/404.html bounce (see the comment there).
      // This is a classic inline script, so it runs during parsing — ahead of
      // the deferred module above — and the router mounts already seeing the
      // path the visitor originally asked for.
      //
      // This script ships on /stills/ and /about/ too (see the template note
      // above), where 'redirect' should never actually be set — those are
      // real 200 files now, not a 404.html bounce target — so on those
      // routes this is normally a same-key read-and-clear no-op.
      const redirect = sessionStorage.getItem('redirect');
      sessionStorage.removeItem('redirect');

      if (redirect && redirect !== window.location.href) {
        history.replaceState(null, '', redirect);
      }
    </script>
  </body>
</html>
