<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Maxwell Yeo</title>
    <meta name="theme-color" content="#242424" />
    <link rel="icon" type="image/png" href="/archive/2024/max-fav.png" />
    <style>
      :root {
        color: #f5f5f5;
        background: #242424;
        font-family: Arial, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main { text-align: center; }
      h1 { font-size: clamp(4rem, 15vw, 10rem); margin: 0; }
      a { color: inherit; }
    </style>
    <script>
      // GitHub Pages has no server-side rewrite, so a deep link to a client-side
      // route (/stills, /about, ...) is served this page instead of the app.
      //
      // The fix is a bounce: stash the URL the visitor actually asked for, load
      // the app at "/", and let portfolio24/index.html read the stash back and
      // history.replaceState() the address bar to it before React mounts. The
      // router then sees the original path and renders it.
      //
      // Every unmatched path bounces, not a hardcoded list of app routes — the
      // router owns the question of what is a real page (it has a "*" catch-all
      // that renders a 404 view), so adding a route needs no change here. The
      // guard below is only to avoid bouncing "/" to itself, which would loop
      // if this page were ever served at the root.
      if (window.location.pathname !== '/') {
        sessionStorage.setItem('redirect', window.location.href);
        window.location.replace(window.location.origin + '/');
      }
    </script>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>I can't find what you're looking for</p>
      <p><a href="/">Go Home</a></p>
    </main>
  </body>
</html>
