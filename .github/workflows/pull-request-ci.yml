name: Pull Request CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio24/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: portfolio24

      - name: Lint
        run: npm run lint
        working-directory: portfolio24

      - name: Build site
        run: npm run build
        working-directory: portfolio24
